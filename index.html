<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generative Playground</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <div class="brand">
                <h1>Generative Playground</h1>
                <p>Creative exploration through algorithms</p>
            </div>

            <div class="header-actions">
                <button id="randomize-btn" class="button button-primary">
                    Randomize
                </button>

                <button id="export-btn" class="button button-secondary">
                    Export
                </button>
            </div>
        </header>

        <section class="workspace">

            <aside class="control-panel">

                <div class="panel-section">
                    <h2>Color palette</h2>

                    <div id="palette-options" class="palette-options">
                        <!-- Palettes generated through JavaScript -->
                    </div>
                </div>

                <div class="panel-section">
                    <h2>Density</h2>

                    <input
                        type="range"
                        id="density"
                        min="10"
                        max="150"
                        value="60"
                    >
                </div>

                <div class="panel-section">
                    <h2>Scale</h2>

                    <input
                        type="range"
                        id="scale"
                        min="10"
                        max="100"
                        value="50"
                    >
                </div>

                <div class="panel-section">
                    <h2>Shape type</h2>

                    <select id="shape-type">
                        <option value="all">All shapes</option>
                        <option value="circles">Circles</option>
                        <option value="rectangles">Rectangles</option>
                        <option value="lines">Lines</option>
                        <option value="polygons">Polygons</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h2>Seed</h2>

                    <input
                        type="number"
                        id="seed"
                        value="48291"
                    >
                </div>

                <button id="reset-btn" class="button button-reset">
                    Reset settings
                </button>

            </aside>

            <section class="canvas-container">

                <div class="canvas-header">
                    <span>Composition / 001</span>
                    <span id="canvas-size">1080 × 1080</span>
                </div>

                <div id="canvas-wrapper">
                    <!-- Canvas created by JavaScript -->
                </div>

            </section>

        </section>

        <footer class="app-footer">
            <span>GENERATIVE PLAYGROUND</span>
            <span>CREATIVE TOOLS FOR EXPERIMENTATION</span>
        </footer>

    </main>

    <!-- External library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

    <!-- Application scripts -->
    <script src="js/palettes.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/random.js"></script>
    <script src="js/artwork.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
